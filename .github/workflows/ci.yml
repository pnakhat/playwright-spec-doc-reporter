name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ─── Unit tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

  # ─── JS ES6 example — API tests ─────────────────────────────────────────────
  example-js-api:
    name: JS ES6 Demo — API Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore API test history
        uses: actions/cache@v4
        with:
          path: examples/js-es6-demo/spec-doc-report/spec-doc-history.json
          key: test-history-api-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            test-history-api-${{ github.ref }}-
            test-history-api-

      - name: Build reporter
        run: npm ci && npm run build

      - name: Install example dependencies
        working-directory: examples/js-es6-demo
        run: npm ci

      - name: Run API tests
        working-directory: examples/js-es6-demo
        run: npx playwright test --project=api

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-es6-api-report
          path: examples/js-es6-demo/spec-doc-report/
          retention-days: 7

  # ─── JS ES6 example — UI tests (no AI key needed) ───────────────────────────
  example-js-ui:
    name: JS ES6 Demo — UI Tests (SauceDemo)
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore UI test history
        uses: actions/cache@v4
        with:
          path: examples/js-es6-demo/spec-doc-report/spec-doc-history.json
          key: test-history-ui-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            test-history-ui-${{ github.ref }}-
            test-history-ui-

      - name: Build reporter
        run: npm ci && npm run build

      - name: Install example dependencies
        working-directory: examples/js-es6-demo
        run: npm ci

      - name: Install Playwright browsers (chromium)
        working-directory: examples/js-es6-demo
        run: npx playwright install chromium --with-deps

      - name: Run UI tests
        working-directory: examples/js-es6-demo
        # Intentional failure tests use test.fail() so Playwright counts them as passing when they fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_ARTIFACT_URL: ${{ github.event_name == 'pull_request' && format('https://{0}.github.io/{1}/reports/pr-{2}/', github.repository_owner, github.event.repository.name, github.event.pull_request.number) || format('https://{0}.github.io/{1}/reports/latest/', github.repository_owner, github.event.repository.name) }}
        run: npx playwright test --project=chromium

      - name: Publish report to GitHub Pages
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEST=${{ github.event_name == 'pull_request' && format('reports/pr-{0}', github.event.pull_request.number) || 'reports/latest' }}
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            _gh_pages
          mkdir -p "_gh_pages/${DEST}"
          cp -r examples/js-es6-demo/spec-doc-report/. "_gh_pages/${DEST}/"
          cd _gh_pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "deploy: report for ${{ github.ref_name }} [skip ci]"
          git push

      - name: Post PR comment with report link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/pr-${{ github.event.pull_request.number }}/
        run: |
          COMMENT_FILE="examples/js-es6-demo/spec-doc-report/pr-comment.md"
          if [ -f "$COMMENT_FILE" ]; then
            # Append live report link to the comment
            echo "" >> "$COMMENT_FILE"
            echo "[📊 View Live Report →]($PAGES_URL)" >> "$COMMENT_FILE"
            gh pr comment ${{ github.event.pull_request.number }} \
              --edit-last \
              --body-file "$COMMENT_FILE" \
            || gh pr comment ${{ github.event.pull_request.number }} \
              --body-file "$COMMENT_FILE"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-es6-ui-report
          path: examples/js-es6-demo/spec-doc-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: js-es6-ui-test-results
          path: examples/js-es6-demo/test-results/
          retention-days: 7

  # ─── E2E report UI tests ─────────────────────────────────────────────────────
  e2e-report-tests:
    name: E2E Report UI Tests
    runs-on: ubuntu-latest
    needs: example-js-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build reporter
        run: npm ci && npm run build

      - name: Restore UI test history (to get a report with trends)
        uses: actions/cache@v4
        with:
          path: examples/js-es6-demo/spec-doc-report/spec-doc-history.json
          key: test-history-ui-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            test-history-ui-${{ github.ref }}-
            test-history-ui-

      - name: Install example dependencies
        working-directory: examples/js-es6-demo
        run: npm ci

      - name: Download UI report artifact
        uses: actions/download-artifact@v4
        with:
          name: js-es6-ui-report
          path: examples/js-es6-demo/spec-doc-report/

      - name: Regenerate report with history embedded
        working-directory: examples/js-es6-demo
        run: node regenerate-ci.mjs

      - name: Install Playwright browsers (chromium)
        run: npx playwright install chromium --with-deps

      - name: Run E2E report tests
        run: npm run test:e2e

      - name: Upload E2E test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-test-results
          path: test-results/
          retention-days: 7

  # ─── Release on merge to main (publish-on-version-change) ────────────────────
  # Publishes whatever version is in package.json, but ONLY when that exact
  # version is not already on npm. Bump the version in your PR to cut a release;
  # merges that don't change the version are a no-op here. This makes releases
  # intentional and prevents double-publishing a version already shipped via a
  # manual `v*` tag (handled by the publish-npm job below).
  auto-release:
    name: Release to npm on version change
    runs-on: ubuntu-latest
    needs: [unit-tests, example-js-api, example-js-ui, e2e-report-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Check whether this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "playwright-spec-doc-reporter@${VERSION}" version >/dev/null 2>&1; then
            echo "v${VERSION} is already on npm — nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} is not on npm — will build, tag, and publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install & build
        if: steps.check.outputs.publish == 'true'
        run: npm ci && npm run build

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Skip if the tag already exists (e.g. created by the publish-npm job).
          if git rev-parse "v${{ steps.check.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.check.outputs.version }} already exists — not re-tagging."
          else
            git tag "v${{ steps.check.outputs.version }}"
            git push --tags
          fi

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish to npm (on manual version tags only) ────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: unit-tests
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install & build
        run: npm ci && npm run build

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
